<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSCEN Brain. Live Neural Activity.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="demos/oscen-demo.css">
    <style>
        body {
            font-family: var(--mono);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        canvas { display: block; }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 20px; left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #hud.hidden { display: none; }
        .hud-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .hud-stat {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-family: var(--mono);
        }
        .hud-stat .val {
            color: var(--text-bright);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .hud-phase {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 12px;
            border-radius: 0;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid var(--hairline-mid);
        }
        .hud-phase.infant     { background: rgba(244, 114, 182, 0.15); color: #f472b6; }
        .hud-phase.toddler    { background: rgba(34, 211, 238, 0.15);  color: #22d3ee; }
        .hud-phase.juvenile   { background: rgba(74, 222, 128, 0.15);  color: var(--ok); }
        .hud-phase.adolescent { background: rgba(251, 191, 36, 0.15);  color: var(--warn); }
        .hud-phase.mature     { background: var(--accent-soft);        color: var(--accent); }

        /* Neuromodulator mini-bars */
        .neuromod-hud {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }
        .nm-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nm-label {
            font-size: 8px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nm-track {
            width: 4px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0;
            position: relative;
            overflow: hidden;
        }
        .nm-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            border-radius: 0;
            transition: height 0.8s ease;
        }
        .nm-fill.da  { background: var(--warn); }
        .nm-fill.ach { background: var(--accent); }
        .nm-fill.ne  { background: var(--err); }
        .nm-fill.sht { background: #a78bfa; }
        .nm-fill.ot  { background: #f472b6; }

        /* Connection status toggle button */
        #connection-status {
            position: absolute;
            top: 20px; right: 20px;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 0;
            z-index: 10;
            font-family: var(--mono);
            font-weight: 600;
            cursor: pointer;
            pointer-events: auto;
            border: 1px solid var(--hairline-mid);
            transition: all var(--t-base) var(--ease);
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #connection-status:hover {
            filter: brightness(1.25);
            border-color: var(--hairline-hi);
        }
        #connection-status .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        #connection-status.status-live {
            background: rgba(74, 222, 128, 0.12);
            color: var(--ok);
            border-color: rgba(74, 222, 128, 0.3);
        }
        #connection-status.status-live .status-dot { background: var(--ok); }
        #connection-status.status-simulated {
            background: rgba(251, 191, 36, 0.12);
            color: var(--warn);
            border-color: rgba(251, 191, 36, 0.3);
        }
        #connection-status.status-simulated .status-dot { background: var(--warn); }
        #connection-status.status-connecting {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: rgba(34, 211, 238, 0.3);
        }
        #connection-status.status-connecting .status-dot { background: var(--accent); animation: pulse 1s infinite; }
        #connection-status.status-disconnected {
            background: rgba(248, 113, 113, 0.12);
            color: var(--err);
            border-color: rgba(248, 113, 113, 0.3);
        }
        #connection-status.status-disconnected .status-dot { background: var(--err); }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Region labels */
        .region-label {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            font-size: 10px;
            font-family: var(--mono);
            color: rgba(230, 230, 230, 0.75);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            white-space: nowrap;
            padding: 4px 9px;
            border-radius: 0;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--hairline);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            transition: color 0.3s, background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .region-label:hover {
            color: var(--text-bright);
            background: rgba(10, 10, 10, 0.9);
            border-color: rgba(34, 211, 238, 0.4);
            box-shadow: 0 0 12px var(--accent-glow);
            z-index: 100;
        }
        .region-label.active {
            color: var(--text-bright);
            background: rgba(10, 10, 10, 0.78);
            border-color: rgba(34, 211, 238, 0.3);
            text-shadow: 0 0 6px var(--accent-glow), 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        /* Module-focus states. Driven by brain-scene.js _setLabelDim().
           dimmed: non-target regions fade back; focused: target region pops. */
        .region-label.dimmed {
            opacity: 0.18;
            transition: opacity 0.5s ease;
        }
        .region-label.focused {
            color: var(--text-bright);
            border-color: var(--accent);
            background: rgba(10, 10, 10, 0.92);
            box-shadow: 0 0 14px var(--accent-glow), 0 0 28px rgba(34, 211, 238, 0.18);
            transition: opacity 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
            z-index: 110;
        }
        .region-label.focused .rate {
            color: var(--accent-hi);
        }
        /* Beliefs Mode (set by brain-scene.js when constellation is up):
           neurons / synapses are hidden, so the region labels are
           meaningless — hide them entirely. */
        body.oscen-beliefs-mode .region-label {
            display: none !important;
        }
        .region-label .rate {
            font-size: 8px;
            color: var(--accent);
            margin-left: 5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* Hover tooltip */
        .region-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            padding: 14px 16px;
            background: rgba(10, 10, 10, 0.94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--hairline-hi);
            border-radius: 0;
            box-shadow: var(--shadow-lg);
            pointer-events: none;
            z-index: 200;
            white-space: normal;
            text-transform: none;
            letter-spacing: 0;
        }
        .region-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: var(--hairline-hi);
        }
        .region-tooltip.flipped::after {
            top: auto;
            bottom: 100%;
            border-top-color: transparent;
            border-bottom-color: var(--hairline-hi);
        }
        .region-label:hover .region-tooltip { display: block; }
        .region-tooltip .tt-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }
        .region-tooltip .tt-neurons {
            font-size: 10px;
            color: var(--accent);
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }
        .region-tooltip .tt-desc {
            font-size: 11px;
            color: var(--text);
            line-height: 1.55;
        }
        .region-tooltip .tt-connections {
            margin-top: 6px;
            font-size: 9px;
            color: var(--text-dim);
        }
        /* Mobile responsive */
        @media (max-width: 768px) {
            .region-label {
                font-size: 8px;
                padding: 2px 5px;
                letter-spacing: 0.5px;
                touch-action: manipulation;
            }
            .region-label .rate {
                font-size: 7px;
            }
            .region-tooltip {
                width: 200px;
                padding: 8px 10px;
            }
            .region-tooltip .tt-name {
                font-size: 10px;
            }
            .region-tooltip .tt-desc {
                font-size: 9px;
            }
            #hud {
                top: 12px;
                left: 12px;
            }
            .hud-title {
                font-size: 12px;
                letter-spacing: 1px;
            }
            .hud-stat {
                font-size: 10px;
            }
            .nm-track {
                height: 30px;
            }
            #connection-status {
                top: 12px;
                right: 12px;
                font-size: 10px;
                padding: 4px 8px;
                touch-action: manipulation;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-title">OSCEN Neural Activity</div>
        <div class="hud-stat">Neurons: <span class="val" id="hud-neurons">--</span></div>
        <div class="hud-stat">Synapses: <span class="val" id="hud-synapses">--</span></div>
        <div class="hud-stat">Step: <span class="val" id="hud-step">--</span></div>
        <div class="hud-stat">Rate: <span class="val" id="hud-rate">--</span> steps/sec</div>
        <div id="hud-phase-container">
            <span class="hud-phase juvenile" id="hud-phase">--</span>
        </div>
        <div class="neuromod-hud">
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill da" id="nm-da" style="height:40%"></div></div>
                <span class="nm-label">DA</span>
            </div>
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill ach" id="nm-ach" style="height:40%"></div></div>
                <span class="nm-label">ACh</span>
            </div>
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill ne" id="nm-ne" style="height:40%"></div></div>
                <span class="nm-label">NE</span>
            </div>
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill sht" id="nm-sht" style="height:40%"></div></div>
                <span class="nm-label">5HT</span>
            </div>
            <div class="nm-bar">
                <div class="nm-track"><div class="nm-fill ot" id="nm-ot" style="height:20%"></div></div>
                <span class="nm-label">OT</span>
            </div>
        </div>
    </div>

    <div id="connection-status" class="status-connecting" title="Click to toggle Live / Simulated">
        <span class="status-dot"></span>
        <span class="status-text">CONNECTING...</span>
    </div>

    <!-- Version toggle removed 2026-07-24: Cinematic is the only version now. -->


    <script type="importmap">
    {
        "imports": {
            "three": "./lib/three.module.min.js",
            "three/addons/controls/OrbitControls.js": "./lib/OrbitControls.js",
            "three/addons/postprocessing/EffectComposer.js": "./lib/EffectComposer.js",
            "three/addons/postprocessing/RenderPass.js": "./lib/RenderPass.js",
            "three/addons/postprocessing/UnrealBloomPass.js": "./lib/UnrealBloomPass.js",
            "three/addons/postprocessing/ShaderPass.js": "./lib/ShaderPass.js",
            "three/addons/shaders/CopyShader.js": "./lib/CopyShader.js",
            "three/addons/shaders/LuminosityHighPassShader.js": "./lib/LuminosityHighPassShader.js",
            "three/addons/loaders/GLTFLoader.js": "./lib/GLTFLoader.js",
            "three/addons/environments/RoomEnvironment.js": "./lib/RoomEnvironment.js"
        }
    }
    </script>

    <!--
      Bootstrap. The Cinematic scene is the ONLY brain-viz version now (the old
      "classic" point-cloud renderer was retired 2026-07-24, see PROGRESS.md).
      Any ?ver= param is ignored -- we always load Cinematic. A failed dynamic
      import falls back to the base scene so the page never renders blank. Embed
      mode (?embed=true) is read by the scene itself to hide the HUD for clean
      iframe embedding (what the marketing site uses).
    -->
    <script type="module">
        const CINEMATIC = './brain-scene-cinematic.js?v=16';
        const FALLBACK  = './brain-scene.js?v=18';   // emergency only, if Cinematic import throws

        import(CINEMATIC)
            .then((m) => m.boot())
            .catch((err) => {
                console.warn('[brain-viz] cinematic scene failed to load, using base fallback:', err);
                return import(FALLBACK).then((m) => m.boot());
            });
    </script>
</body>
</html>
