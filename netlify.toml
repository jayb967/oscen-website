[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # These values are intentionally public and end up in the built output, so the secret scanner
  # would flag them (their values match env vars):
  # - PUBLIC_META_DOMAIN_VERIFICATION must appear in <meta> for Meta to verify
  # - PUBLIC_META_PIXEL_ID appears in fbq('init', ...) on the page
  # - PUBLIC_SUPPORTERS_URL (crm.oscen.ai/api/public/supporters) is inlined by Astro + a hardcoded
  #   fallback in ContributorWall.astro. It is a public read-only endpoint, not a secret.
  # - PUBLIC_TURNSTILE_SITE_KEY is the Cloudflare Turnstile CAPTCHA site key; it is public by
  #   design and appears in the rendered widget markup on the form pages.
  # - PUBLIC_REDDIT_PIXEL_ID / PUBLIC_TIKTOK_PIXEL_ID appear in rdt('init', ...) / the TikTok
  #   events.js sdkid on the page; public by design, like the Meta pixel id.
  # INQUIRY_SECRET, TURNSTILE_SECRET_KEY, REDDIT_CAPI_TOKEN and TIKTOK_EVENTS_ACCESS_TOKEN are NOT here on purpose: they are real secrets, read
  # only server-side in the relay function, and must stay scanned so they can never leak into the build.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_META_DOMAIN_VERIFICATION,PUBLIC_META_PIXEL_ID,PUBLIC_SUPPORTERS_URL,PUBLIC_TURNSTILE_SITE_KEY,PUBLIC_REDDIT_PIXEL_ID,PUBLIC_TIKTOK_PIXEL_ID,PUBLIC_X_PIXEL_ID,PUBLIC_X_EVENT_LEAD,PUBLIC_X_EVENT_SUBSCRIBE,PUBLIC_X_EVENT_REGISTRATION,PUBLIC_X_EVENT_PURCHASE"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
